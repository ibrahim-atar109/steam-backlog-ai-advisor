<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Backlog & Library Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --bg-card: #141417;
            --bg-input: #1a1a1e;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-red: #dc2626;
            --accent-red-hover: #ef4444;
            --accent-red-subtle: rgba(220, 38, 38, 0.15);
            --success-green: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 10px 0 24px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        h1 {
            color: var(--text-main);
            margin: 0 0 6px 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--accent-red);
        }

        p.subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .ai-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-red);
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 24px;
        }

        .ai-box h2 {
            color: var(--text-main);
            margin: 0 0 12px 0;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-input-group {
            display: flex;
            gap: 10px;
        }

        .ai-response {
            margin-top: 12px;
            font-size: 13.5px;
            color: #d4d4d8;
            display: none;
            padding: 12px;
            background: var(--bg-input);
            border-radius: 4px;
            border: 1px solid var(--border-color);
            line-height: 1.5;
        }

        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tab-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 8px 18px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background-color: var(--bg-card);
        }

        .tab-btn.active {
            background-color: var(--accent-red-subtle);
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .stats-bar {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 6px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 24px;
        }

        .stat-item { text-align: center; }
        .stat-val { font-size: 20px; font-weight: 700; color: var(--text-main); }
        .stat-lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

        .controls-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 6px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .search-group { display: flex; gap: 8px; flex: 1; min-width: 220px; }

        input, select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.15s;
        }

        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        input:focus, select:focus {
            border-color: var(--accent-red);
        }

        button {
            background-color: var(--accent-red);
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.15s ease;
        }

        button:hover { background-color: var(--accent-red-hover); }

        button.btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        button.btn-secondary:hover {
            background-color: var(--bg-input);
            color: var(--text-main);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 16px;
        }

        .game-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.15s ease;
        }

        .game-card:hover {
            border-color: #3f3f46;
        }

        .game-title { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .game-dev { font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px; }
        .game-price { font-size: 14px; font-weight: 600; color: var(--success-green); }

        .library-controls {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hours-tag {
            font-size: 12px;
            color: var(--accent-red);
            font-weight: 600;
        }

        .deal-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            font-size: 12px;
            width: 100%;
            margin-top: 4px;
        }
        .deal-btn:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
            background: transparent;
        }

        .save-hours-btn {
            background-color: #27272a;
            color: var(--text-main);
            font-size: 12px;
            width: 100%;
        }
        .save-hours-btn:hover { background-color: var(--accent-red); }

        .deal-result {
            font-size: 12px;
            color: #f59e0b;
            font-weight: 600;
            margin-top: 6px;
            text-align: center;
        }

        .text-muted { color: var(--text-muted); font-weight: normal; font-size: 11.5px; }

        .analytics-view {
            display: none;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            gap: 32px;
        }

        .analytics-view.active {
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .analytics-view.active {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        .chart-section {
            flex: 1;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .ranked-section {
            flex: 1;
            width: 100%;
        }

        .ranked-section h3 {
            margin: 0 0 16px 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .ranked-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .ranked-item {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 10px 14px;
            gap: 12px;
        }

        .ranked-rank {
            font-weight: 700;
            font-size: 14px;
            color: var(--accent-red);
            min-width: 28px;
        }

        .ranked-info {
            flex: 1;
            overflow: hidden;
        }

        .ranked-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ranked-dev {
            font-size: 11.5px;
            color: var(--text-muted);
        }

        .ranked-hours {
            font-size: 13px;
            font-weight: 700;
            color: var(--success-green);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>STEAM BACKLOG <span>& LIBRARY</span></h1>
        <p class="subtitle">Track game progress, analyze hours, and retrieve live CheapShark deals</p>
    </header>

    <div class="ai-box">
        <h2>AI Game Advisor</h2>
        <div class="ai-input-group">
            <input type="text" id="aiPromptInput" placeholder="Ask for a recommendation (e.g. 'Short story RPG under $20')..." style="flex:1;" onkeyup="if(event.key==='Enter') askAiAdvisor()">
            <button onclick="askAiAdvisor()">Ask AI</button>
        </div>
        <div id="aiResponseBox" class="ai-response"></div>
    </div>

    <div class="controls-panel" style="margin-bottom: 16px;">
        <div class="search-group">
            <input type="text" id="steamIdInput" placeholder="Enter 17-digit Steam ID64..." style="flex:1;">
            <button id="syncBtn" onclick="syncSteamLibraryWithId()">Sync Steam Profile</button>
        </div>
    </div>

    <div class="tab-nav">
        <button id="tabAll" class="tab-btn active" onclick="switchTab('ALL')">All Games</button>
        <button id="tabLibrary" class="tab-btn" onclick="switchTab('LIBRARY')">My Library</button>
        <button id="tabAnalytics" class="tab-btn" onclick="switchTab('ANALYTICS')">Analytics</button>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div id="statTotalGames" class="stat-val">0</div>
            <div class="stat-lbl">Library Games</div>
        </div>
        <div class="stat-item">
            <div id="statTotalHours" class="stat-val">0.0 hrs</div>
            <div class="stat-lbl">Total Time Played</div>
        </div>
    </div>

    <div class="controls-panel" id="searchControls">
        <div class="search-group">
            <input type="text" id="searchInput" placeholder="Search title..." onkeyup="if(event.key==='Enter') searchGames()">
            <button onclick="searchGames()">Search</button>
        </div>
        <div class="search-group">
            <input type="number" id="budgetInput" placeholder="Max price ($)" step="0.01">
            <button onclick="filterByBudget()">Filter Budget</button>
        </div>
        <button class="btn-secondary" onclick="loadAllGames()">Reset</button>
    </div>

    <div id="gamesGrid" class="games-grid"></div>

    <div id="analyticsView" class="analytics-view">
        <div class="chart-section">
            <canvas id="hoursChart"></canvas>
        </div>
        <div class="ranked-section">
            <h3>Leaderboard (Ranked by Hours)</h3>
            <div id="rankedGamesList" class="ranked-list"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/games';
    let currentTab = 'ALL';
    let allGamesData = [];
    let hoursChart = null;

    document.addEventListener('DOMContentLoaded', () => {
        const savedSteamId = localStorage.getItem('user_steam_id');
        if (savedSteamId) {
            document.getElementById('steamIdInput').value = savedSteamId;
        }
        loadAllGames();
    });

    function syncSteamLibraryWithId() {
        const steamId = document.getElementById('steamIdInput').value.trim();
        const syncBtn = document.getElementById('syncBtn');

        if (steamId) {
            localStorage.setItem('user_steam_id', steamId);
        }

        if (syncBtn) {
            syncBtn.innerText = 'Syncing...';
            syncBtn.disabled = true;
        }

        const url = steamId
            ? `${API_URL}/sync-user-library?steamId=${encodeURIComponent(steamId)}`
            : `${API_URL}/sync-user-library`;

        fetch(url, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (syncBtn) {
                    syncBtn.innerText = 'Sync Steam Profile';
                    syncBtn.disabled = false;
                }

                if (data.count === 0) {
                    alert(data.message || 'No games found. Please check that the Steam ID is correct and that Profile/Game details are set to PUBLIC on Steam.');
                }
                loadAllGames();
            })
            .catch(() => {
                if (syncBtn) {
                    syncBtn.innerText = 'Sync Steam Profile';
                    syncBtn.disabled = false;
                }
                alert('Failed to connect to backend server.');
            });
    }

    function askAiAdvisor() {
        const promptInput = document.getElementById('aiPromptInput');
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        const box = document.getElementById('aiResponseBox');
        box.style.display = 'block';
        box.innerHTML = '<i>Analyzing library catalog...</i>';

        fetch(`${API_URL}/ai-recommend?prompt=${encodeURIComponent(prompt)}`)
            .then(res => res.json())
            .then(data => {
                box.innerText = data.recommendation;
            })
            .catch(() => {
                box.innerText = "Couldn't fetch AI recommendation.";
            });
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabAll').className = tab === 'ALL' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tabLibrary').className = tab === 'LIBRARY' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tabAnalytics').className = tab === 'ANALYTICS' ? 'tab-btn active' : 'tab-btn';

        const searchControls = document.getElementById('searchControls');
        const gamesGrid = document.getElementById('gamesGrid');
        const analyticsView = document.getElementById('analyticsView');

        if (tab === 'ANALYTICS') {
            searchControls.style.display = 'none';
            gamesGrid.style.display = 'none';
            analyticsView.className = 'analytics-view active';
            renderAnalytics();
        } else {
            analyticsView.className = 'analytics-view';
            gamesGrid.style.display = 'grid';
            searchControls.style.display = tab === 'ALL' ? 'flex' : 'none';

            if (tab === 'LIBRARY') {
                syncSteamLibraryWithId();
            } else {
                renderView();
            }
        }
    }

    function loadAllGames() {
        fetch(API_URL)
            .then(res => res.json())
            .then(games => {
                allGamesData = games;
                updateStats();
                if (currentTab === 'ANALYTICS') {
                    renderAnalytics();
                } else {
                    renderView();
                }
            });
    }

    function updateStats() {
        const libraryGames = allGamesData.filter(g => g.status && g.status !== 'UNPLAYED');
        const totalHours = libraryGames.reduce((acc, g) => acc + (g.hoursPlayed || 0), 0);

        document.getElementById('statTotalGames').innerText = libraryGames.length;
        document.getElementById('statTotalHours').innerText = `${totalHours.toFixed(1)} hrs`;
    }

    function searchGames() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return loadAllGames();

        fetch(`${API_URL}/search?query=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(games => displayGames(games));
    }

    function filterByBudget() {
        const maxPrice = document.getElementById('budgetInput').value;
        if (!maxPrice) return;

        fetch(`${API_URL}/under?maxPrice=${maxPrice}`)
            .then(res => res.json())
            .then(games => displayGames(games));
    }

    function saveGameProgress(gameId) {
        const hours = parseFloat(document.getElementById(`hours-${gameId}`).value) || 0;
        const status = document.getElementById(`status-${gameId}`).value;

        fetch(`${API_URL}/${gameId}/log-hours?hours=${hours}&status=${status}`, { method: 'PUT' })
            .then(res => res.json())
            .then(() => {
                loadAllGames();
            });
    }

    function renderView() {
        if (currentTab === 'LIBRARY') {
            const libraryGames = allGamesData.filter(g => g.status && g.status !== 'UNPLAYED');
            displayGames(libraryGames);
        } else {
            displayGames(allGamesData);
        }
    }

    function displayGames(games) {
        const container = document.getElementById('gamesGrid');
        container.innerHTML = '';

        if (games.length === 0) {
            container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 30px 0;">No games matching criteria.</p>';
            return;
        }

        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';

            const inLibrary = game.status && game.status !== 'UNPLAYED';

            card.innerHTML = `
                <div>
                    <div class="game-title">${escapeHtml(game.title)}</div>
                    <div class="game-dev">${escapeHtml(game.developer)}</div>
                    <div class="game-price">${game.price === 0 ? 'FREE' : '$' + game.price.toFixed(2)}</div>
                </div>

                <div class="library-controls">
                    ${inLibrary ? `<div class="hours-tag">⏱️ ${game.hoursPlayed || 0} hrs logged</div>` : ''}

                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="number" id="hours-${game.id}" value="${game.hoursPlayed || 0}" step="0.5" min="0" style="width: 65px;" placeholder="Hrs">
                        <select id="status-${game.id}" style="flex:1;">
                            <option value="IN_PROGRESS" ${game.status === 'IN_PROGRESS' ? 'selected' : ''}>In Progress</option>
                            <option value="COMPLETED" ${game.status === 'COMPLETED' ? 'selected' : ''}>Completed</option>
                            <option value="UNPLAYED" ${!game.status || game.status === 'UNPLAYED' ? 'selected' : ''}>Not In Library</option>
                        </select>
                    </div>

                    <button class="save-hours-btn" onclick="saveGameProgress(${game.id})">
                        Save Progress
                    </button>

                    <div id="deal-${game.id}">
                        <button class="deal-btn" onclick="checkLiveDeal('${escapeHtml(game.title)}', ${game.id})">
                            Check Live Deals
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderAnalytics() {
        const playedGames = allGamesData
            .filter(g => (g.hoursPlayed || 0) > 0)
            .sort((a, b) => (b.hoursPlayed || 0) - (a.hoursPlayed || 0));

        const rankedList = document.getElementById('rankedGamesList');
        rankedList.innerHTML = '';

        if (playedGames.length === 0) {
            rankedList.innerHTML = '<p class="text-muted" style="text-align: center; padding: 20px 0;">No played games recorded yet.</p>';
        } else {
            playedGames.forEach((game, index) => {
                const item = document.createElement('div');
                item.className = 'ranked-item';
                item.innerHTML = `
                    <div class="ranked-rank">#${index + 1}</div>
                    <div class="ranked-info">
                        <div class="ranked-title">${escapeHtml(game.title)}</div>
                        <div class="ranked-dev">${escapeHtml(game.developer)}</div>
                    </div>
                    <div class="ranked-hours">${(game.hoursPlayed || 0).toFixed(1)} hrs</div>
                `;
                rankedList.appendChild(item);
            });
        }

        const ctx = document.getElementById('hoursChart').getContext('2d');
        if (hoursChart) {
            hoursChart.destroy();
        }

        if (playedGames.length === 0) return;

        const labels = playedGames.map(g => g.title);
        const data = playedGames.map(g => g.hoursPlayed);

        const colors = [
            '#dc2626', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6',
            '#ec4899', '#6366f1', '#14b8a6', '#84cc16', '#a855f7',
            '#06b6d4', '#f97316', '#e11d48', '#22c55e', '#ef4444'
        ];

        hoursChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: playedGames.map((_, i) => colors[i % colors.length]),
                    borderColor: '#141417',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#a1a1aa',
                            font: { size: 12 },
                            padding: 14
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return ` ${context.label}: ${context.raw} hrs`;
                            }
                        }
                    }
                }
            }
        });
    }

    function checkLiveDeal(gameTitle, cardId) {
        const dealContainer = document.getElementById(`deal-${cardId}`);
        dealContainer.innerHTML = '<div class="deal-result text-muted">Searching CheapShark...</div>';

        fetch(`${API_URL}/deal?title=${encodeURIComponent(gameTitle)}`)
            .then(res => {
                if (!res.ok) throw new Error('API Response Error');
                return res.text().then(text => text ? JSON.parse(text) : null);
            })
            .then(deal => {
                if (deal && deal.salePrice) {
                    const savingsPct = Math.round(parseFloat(deal.savings));
                    dealContainer.innerHTML = `<div class="deal-result">🔥 Live Deal: $${deal.salePrice} (${savingsPct}% OFF)</div>`;
                } else {
                    dealContainer.innerHTML = '<div class="deal-result text-muted">No active deals found</div>';
                }
            })
            .catch(() => {
                dealContainer.innerHTML = '<div class="deal-result text-muted">No active deals found</div>';
            });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
</script>
</body>
</html>
